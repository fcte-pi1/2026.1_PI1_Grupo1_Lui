services:
  influxdb:
    image: influxdb:2.7
    container_name: micromouse_influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=senha123456
      - DOCKER_INFLUXDB_INIT_ORG=micromouse
      - DOCKER_INFLUXDB_INIT_BUCKET=micromouse_telemetria
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=micromouse-token-12345
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: micromouse_backend
    ports:
      - "41234:41234/udp"
    environment:
      - UDP_PORT=41234
      - UDP_HOST=0.0.0.0
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=micromouse-token-12345
      - INFLUX_ORG=micromouse
      - INFLUX_BUCKET=micromouse_telemetria
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: micromouse_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=micromouse_123
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data: